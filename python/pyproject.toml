[project]
name = "chutesim"
version = "0.1.0"
description = "Parachute drop simulator, virtual sensors and shared sim/real estimation pipeline"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "mujoco>=3.15.0",
    "numpy>=2.2.6",
    "opencv-contrib-python>=5.0.0.93",
    "pymoo>=0.6.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch>=2.14.1",
    "trimesh>=5.1.1",
]

[project.scripts]
chutesim = "chutesim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chutesim", "pipeline", "validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders full drops"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
