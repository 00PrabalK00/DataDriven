; BNO085 IMU logger for the parachute payload (ESP32-S3, 8 MB flash / 8 MB PSRAM, native USB).
; Build + flash:  pio run -d firmware/imu_logger -t upload
; LED_PIN / LED_ACTIVE_LOW: sync LED (default = XIAO ESP32-S3 user LED on GPIO21, active low).
; BNO_SDA / BNO_SCL: set to force I2C pins; -1 = auto-detect over common ESP32-S3 pin pairs.
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
monitor_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLED_PIN=21
    -DLED_ACTIVE_LOW=1
    -DBNO_SDA=-1
    -DBNO_SCL=-1
    -DIMU_PERIOD_US=5000
lib_deps =
    adafruit/Adafruit BNO08x@1.2.5
